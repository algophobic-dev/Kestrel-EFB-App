name: Build Windows app
# Builds windows/ into one Kestrel-EFB.exe and attaches it to a release.
# Run it from the Actions tab, or it runs by itself whenever a release is published.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach the .exe to
        default: v1.1
        required: true
  release:
    types: [published]
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build
        run: dotnet publish windows/KestrelEFB.csproj -c Release -o out
      - name: Keep the .exe with this run
        uses: actions/upload-artifact@v4
        with:
          name: Kestrel-EFB-windows
          path: out/Kestrel-EFB.exe
      - name: Attach to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: gh release upload "$TAG" out/Kestrel-EFB.exe --clobber --repo "$GITHUB_REPOSITORY"
